task: mathqa_local
dataset_path: json
dataset_kwargs:
  data_files:
    train: /workspace/sea-llm/data/control_tasks/mathqa/train.json
    validation: /workspace/sea-llm/data/control_tasks/mathqa/dev.json
    test: /workspace/sea-llm/data/control_tasks/mathqa/test.json
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_text: "Question: {{Problem}}\nAnswer:"
doc_to_target: "{{['a', 'b', 'c', 'd', 'e'].index(correct)}}"
doc_to_choice: !function utils.doc_to_choice
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
